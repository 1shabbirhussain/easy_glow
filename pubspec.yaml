name: easy_glow
description: >-
  Add neon, contour, ambient backlight, rotating gradient border, ripple pulse
  and box glow effects to any Flutter widget, image, icon or text in one line.
version: 0.1.0
homepage: https://github.com/dawateislami/easy_glow
repository: https://github.com/dawateislami/easy_glow
issue_tracker: https://github.com/dawateislami/easy_glow/issues
documentation: https://github.com/dawateislami/easy_glow#readme

topics:
  - glow
  - neon
  - animation
  - ui
  - effects

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

screenshots:
  - description: Contour (neon) glow on an icon that follows its exact shape.
    path: doc/screenshots/contour.png
  - description: Ambient backlight glow bleeding an image's own colors.
    path: doc/screenshots/ambient.png
  - description: Rotating gradient border glow on a call-to-action button.
    path: doc/screenshots/border.png
  - description: Ripple pulse glow on a live avatar.
    path: doc/screenshots/ripple.png
